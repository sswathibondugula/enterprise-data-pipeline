name: ETL CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project
        run: |
          pip install -e .

      - name: Install test and code-quality tools
        run: |
          pip install pytest ruff

      - name: Run critical code-quality checks
        run: |
          ruff check src scripts tests --select E9,F63,F7,F82

      - name: Run test suite
        run: |
          python -m pytest -v