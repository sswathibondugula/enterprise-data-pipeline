[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-data-pipeline"
version = "0.1.0"
description = "A production-style enterprise data pipeline and ETL automation system."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
[tool.setuptools.packages.find]
where = ["src"]
